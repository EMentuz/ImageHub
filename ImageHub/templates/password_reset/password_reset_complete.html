{% extends 'base.html' %}

{% block title %}Пароль восстановлен | ImageHub{% endblock %}

{% block content %}
<div class="password-success">
    <div class="success-icon">✓</div>

    <h2>Пароль успешно изменён!</h2>

    <p>

</div>
{% endblock %}
