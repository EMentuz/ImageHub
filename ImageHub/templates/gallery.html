{% extends 'base.html' %}
{% load static %}


{% block content %}
    <form method="GET" action="{% url 'gallery' %}" class="search-form">
        <input type="text" name="q" placeholder="Поиск изображений..." value="{{ search_query }}">



        <select name="category">
                <option value="">Все категории</option>
                {% for category in categories %}
                    <option value="{{ category.id }}"
                        {% if selected_category == category.id|stringformat:"s" %}selected{% endif %}>
                        {{ category.name }}
                    </option>
                {% endfor %}
        </select>

        <select name="sort">
            <option value="newest" {% if sort_by == "newest" %}selected{% endif %}>
                Сначала новые
            </option>

            <option value="oldest" {% if sort_by == "oldest" %}selected{% endif %}>
                Сначала старые
            </option>
        </select>

        <button type="submit">Найти</button>
    </form>

        {% if images %}
        <div class="image-container"> <!-- Добавление контейнера для изображений -->
            {% for image in images %}
            <a href="{% url 'image_detail' image.id %}">
            <img src="{{ image.file.url }}">
        </a>


            {% endfor %}
        </div>
    {% else %}
        <h3>Пусто(</h3>
    {% endif %}

{% endblock %}
