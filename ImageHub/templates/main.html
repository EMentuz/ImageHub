{% extends 'base.html' %}
{% load static %}


{% block content %}

        {% if images %}
        <div class="image-container"> <!-- Добавление контейнера для изображений -->
            {% for image in images %}
            <a href="{% url 'image_detail' image.id %}">
            <img src="{{ image.file.url }}">
        </a>


            {% endfor %}
        </div>
    {% else %}
        <h3>Пусто(</h3>
    {% endif %}

{% endblock %}
